name: Mathics3 (opensuse-tumbleweed)

on:
  push:
    branches: [ master, opensuse-workflow ]
  pull_request:
    branches: '**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed

    steps:
    - uses: actions/checkout@v4
    - name: Install OS dependencies
      run: |
        zypper ref && \
        zypper --non-interactive install --no-recommends \
                  gcc-c++ \
                  git \
                  make \
                  remake \
                  python311-devel \
                  python311-{numpy1,colorama,mpmath,pexpect,pip,python-dateutil,setuptools,sympy,wheel,Pint,Pympler,llvmlite,scipy,Pillow}
    - name: Set up Python virtual env
      run: |
        python3.11 -m venv ${PWD}/mathics-venv
    - name: Install Mathics3 with full dependencies
      run: |
        # First install our patched version of stopit
        git clone --depth 1 https://github.com/Mathics3/stopit.git
        cd stopit/
        ../mathics-venv/bin/pip3 install -e .
        cd ..
        ./mathics-venv/bin/python3.11 -m pip install Mathics-Scanner[full]
        remake -x develop-full
    - name: Test Mathics
      run: |
        PYTHON=./mathics-venv/python3.11 make -j3 check
